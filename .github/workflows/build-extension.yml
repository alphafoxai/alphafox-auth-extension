name: Build Extension Package

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.alphafox/**'
      - '.github/workflows/workspace-governance.yml'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level high

      - name: Build extension assets
        run: pnpm run build

      - name: Package extension zip
        run: pnpm run zip

      - name: Upload build artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: alphafox-auth-extension
          path: alphafox-auth-extension.zip
          if-no-files-found: error
          # The zip is also published to the `latest` release below, so the
          # Actions artifact is only a per-run copy. Default 90-day retention
          # accumulated 26 duplicates (~7 MB) against the storage quota.
          retention-days: 7

      # Fixed tag "latest" so the download URL stays stable across pushes:
      # https://github.com/alphafoxai/alphafox-auth-extension/releases/latest/download/alphafox-auth-extension.zip
      - name: Publish latest release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: latest
          name: Latest build
          prerelease: false
          makeLatest: true
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          artifacts: alphafox-auth-extension.zip
          artifactContentType: application/zip
          body: |
            Automated Chrome extension build from `main`.

            - Commit: `${{ github.sha }}`
            - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Download `alphafox-auth-extension.zip`, unzip it, then load the folder in Chrome via `chrome://extensions` → Developer mode → Load unpacked.
