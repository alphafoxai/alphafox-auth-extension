version: 2
updates:
  # npm ecosystem at /: weekly, minor and patch grouped, no auto-merge.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      npm-root-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  # github-actions ecosystem at /: weekly, minor and patch grouped, no auto-merge.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      github-actions-root-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
